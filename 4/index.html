<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Kellan Rutherford Jr">
  <meta name="description" content="Blank">
  <title>Up in space!</title>

  <base href="/4/">
   
  <!--Favicon.io : Creation of Faviocon and Tags  -->
  <link rel="apple-touch-icon" sizes="180x180" href="content/img/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="content/img/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="content/img/favicon/favicon-16x16.png">
  <link rel="manifest" href="content/img/favicon/site.webmanifest">

  <!-- Boostrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <!-- Material Symbols -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <link rel="stylesheet" href="css/styles.css">
</head>

<body class="min-vh-100 d-flex flex-column">

  <header>
    <nav class="navbar navbar-expand-sm navbar-dark" id="mainNavBar">
      <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">Up in Space!</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="material-symbols-outlined NavMenuIcon">menu</span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <!-- Script: navBarHandler.js -->
          <ul class="navbar-nav" id="NavsHolder">
          </ul>
        </div>

      </div>
    </nav>

  </header>

  <main class="container-fluid flex-grow-1 d-flex flex-column pt-3 ">
    <h1 class="text-center mb-4">Welcome to the Space Explorer!</h1>
    <div class="container border rounded-5 text-light bg-dark d-flex flex-column justify-content-center align-items-center w-auto">
      <p class="fw-bold fs-1 mb-0">Login</p>
      <img src="content/img/planet_logo.svg" alt="Website Logo" class="img-fluid mb-3">
      <p class="fw-bold fs-5 mb-3 w-50">Please enter your credentials to access the Space Explorer.</p>
      <form class="mb-3 form-group fw-bold bg-transparent w-50 h-50 d-flex flex-column justify-content-center align-items-center"
        id="ContactForm">
        <label for="username">Username:</label>
        <input type="text" class="form-control bg-transparent text-light" id="username" name="username" required>
        <label for="password">Password:</label>
        <input type="password" class="form-control bg-transparent text-light" id="passowrd" name="password" required>
        <button type="submit" class="btn btn-primary mt-3">Submit</button>
      </form>
    </div>

  </main>

  <footer class="footer container-fluid bg-dark text-light h-25 d-flex flex-column rounded-top-4 pt-3">
    <div class=" container-fluid d-flex flex-grow-1">
      <div class="row w-100 border rounded-3 m-0">

        <div id="InternalRedirects" class=" pt-2 footercolumn d-flex flex-column col justify-content-evenly fw-bold">
        </div>
        <div class="footercolumn col p-3 d-flex justify-content-center" id="Statements">
          <p class="h-100">"Showing the complicated cosmos, one step at a time."</p>
        </div>
        <div class="footercolumn col m-0 d-flex justify-content-center pt-3 pb-3" id="ExternalRedirects">
          <div class=" d-inline-flex w-100 ">
            <img src="content/img/github_logo.svg" class="w-25 h-25" alt="Link to Github Repository" id="GitHubLogo">
            <a class="h-25 w-75 fs-5" href="https://github.com/KellanR/kellanr.github.io"
              style="color: white; text-decoration: none;">Github Repository</a>
          </div>
        </div>
      </div>

    </div>
    <p class="text-center mb-0 py-2">2026 Kellan Rutherford Jr.</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="JS/navBarHandler.js"></script>
</body>

</html>
